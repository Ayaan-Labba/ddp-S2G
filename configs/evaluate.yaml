# =============================================================================
# S2G — Evaluation Configuration
# =============================================================================
# Usage:
#   python -m s2g.scripts.evaluate --config configs/evaluate.yaml \
#       model.pretrained_checkpoint=outputs/finetune/conll04/best_model \
#       data.data_dir=data/conll04 \
#       data.rel_schema=data/conll04/relation.schema \
#       data.ent_schema=data/conll04/entity.schema \
#       data.output_dir=outputs/finetune/conll04/eval \
#       evaluation.split=test
# =============================================================================

model:
  name: google/flan-t5-base
  pretrained_checkpoint: outputs/finetune/ner-base-conll04-natural/best_model
  variant: joint

tokenizer:
  max_source_length: 240
  max_target_length: 180

generation:
  num_beams: 3
  constraint_decoding: true        # Set true for FSM-constrained evaluation

evaluation:
  split: test                       # "val" or "test"
  batch_size: 128

validation:
  batch_size: 128                   # Inference batch size

train:
  seed: 0
  warm_start: true

prompt:
  mode: budget
  type: natural
  random_prompt: false

graph:
  random_graph: false
  use_rejection: false
  use_nesting: true

data:
  data_dir: data/conll04
  rel_schema: data/conll04/relation.schema
  ent_schema: data/conll04/entity.schema
  output_dir: outputs/finetune/ner-base-conll04-natural/eval

hardware:
  num_workers: 4
  persistent_workers: true
  gpu_ids: [0]
